server:
  port: 8080

spring:
  application:
    name: flash-ticket-engine

  datasource:
    url: jdbc::postgresql://localhost:5432/ticket_db
    username: ticket_user
    password: ticket_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: ticket_user
    password: ticket_pass
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
