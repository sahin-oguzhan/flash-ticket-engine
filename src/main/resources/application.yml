server:
  port: 8080

spring:
  application:
    name: flash-ticket-engine

  datasource:
    url: jdbc:postgresql://localhost:5433/ticket_db
    username: ticket_user
    password: ticket_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: ticket_user
    password: ticket_pass
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 5000ms
        prefetch: 10
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: flash-ticket-engine
    distribution:
      percentiles-histogram:
        http.server.requests: true
